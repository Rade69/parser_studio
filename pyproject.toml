[project]
name = "parser-studio"
version = "0.1.0"
description = "Alat za poluautomatsko pravljenje parsera faktura za Deklarant Pro (bez LLM-a)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.0",
    "cryptography>=41.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
psbuild = "cli.psbuild:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gui: testovi koji zahtijevaju Qt (preskacu se u headless CI)",
    "realdata: testovi koji zahtijevaju stvarne uzorke faktura van repozitorijuma",
]

[tool.ruff]
line-length = 100
target-version = "py311"
